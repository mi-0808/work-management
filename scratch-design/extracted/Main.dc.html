<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
    a { color: #0e7490; } a:hover { color: #164e63; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #fafafa; color: #171717; display: flex; flex-direction: column; overflow: hidden">
  <div style="background: rgba(10,10,10,.94); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px">
    <div style="display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: oklch(52% 0.11 220); display: grid; place-items: center; font-size: 15px">🌻</div>
      ひまわり事務機
    </div>
    <div style="width: 34px; height: 34px; border-radius: 50%; background: oklch(52% 0.11 220); display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff">高</div>
  </div>
  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <div style="background: linear-gradient(135deg, #eef6f9 0%, #ffffff 60%); border: 1px solid #e5e5e5; border-radius: 20px; padding: 22px; position: relative; overflow: hidden">
      <div style="position: absolute; right: -40px; top: -40px; width: 150px; height: 150px; border-radius: 50%; border: 1.5px solid rgba(14,116,144,.25); box-shadow: 0 0 0 20px rgba(14,116,144,.07), 0 0 0 44px rgba(14,116,144,.04)"></div>
      <div style="font-size: 13px; color: #525252">2026年9月1日(火)</div>
      <div style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 44px; font-weight: 700; letter-spacing: -1px; margin: 4px 0 14px">14:07:26</div>
      <div style="display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #e5e5e5; border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700; margin-bottom: 14px">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #047857"></span>勤務中
      </div>
      <div style="display: flex; gap: 10px">
        <div style="flex: 1; display: flex; gap: 1px">
          <div style="flex: 1; background: #171717; color: #fff; border-radius: 12px 0 0 12px; padding: 14px 0; text-align: center; font-weight: 700; font-size: 15px; opacity: .5">出勤 09:00</div>
          <div style="min-width: 44px; background: #171717; color: rgba(255,255,255,.8); border-radius: 0 12px 12px 0; display: grid; place-items: center">✎</div>
        </div>
        <div style="flex: 1; display: flex; gap: 1px">
          <div style="flex: 1; background: #fff; border: 1px solid #d4d4d4; border-radius: 12px 0 0 12px; padding: 14px 0; text-align: center; font-weight: 700; font-size: 15px">退勤する</div>
          <div style="min-width: 44px; background: #fff; border: 1px solid #d4d4d4; border-left: none; color: #525252; border-radius: 0 12px 12px 0; display: grid; place-items: center">✎</div>
        </div>
      </div>
      <div style="margin-top: 10px; background: #fff; color: #0e7490; border: 1px solid rgba(14,116,144,.35); border-radius: 12px; padding: 13px 0; text-align: center; font-weight: 700; font-size: 14px">中抜け・休憩を開始</div>
    </div>
    <div style="background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; padding: 18px">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; margin-bottom: 10px">
        今日の予定 <span style="font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #eef6f9; color: #0e7490">出勤時に登録</span>
      </div>
      <div style="border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px; font-size: 14px; color: #171717; background: #fbfcfe">見積書の作成、14時から取引先訪問</div>
      <div style="display: flex; gap: 10px; margin-top: 12px">
        <div style="background: oklch(52% 0.11 220); color: #fff; border-radius: 10px; padding: 12px 18px; font-size: 14px; font-weight: 700">予定を保存</div>
        <div style="background: #fff; border: 1px solid #e5e5e5; color: #525252; border-radius: 10px; padding: 12px 18px; font-size: 14px; font-weight: 700">🎥 MyHood</div>
      </div>
    </div>
    <div style="background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; padding: 18px; flex: 1">
      <div style="font-size: 16px; font-weight: 700; margin-bottom: 10px">最近の勤怠</div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #525252; padding-bottom: 8px; border-bottom: 1px solid #e5e5e5">
        <span>日付</span><span>出勤</span><span>退勤</span><span>実働</span><span>状態</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 10px 0; border-bottom: 1px solid #f0f0f0">
        <span>09/01</span><span>09:00</span><span>—</span><span>5:07</span>
        <span style="font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #e0eef3; color: #0e7490">勤務中</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 10px 0">
        <span>08/31</span><span>09:00</span><span>18:00</span><span>9:00</span>
        <span style="font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #e0eef3; color: #0e7490">退勤済み</span>
      </div>
    </div>
  </div>
  <div style="background: rgba(10,10,10,.94); display: flex; justify-content: space-around; padding: 10px 12px 22px">
    <div style="color: #fff; background: rgba(255,255,255,.14); border-radius: 12px; padding: 8px 18px; font-size: 12px; font-weight: 700; text-align: center">ホーム</div>
    <div style="color: rgba(255,255,255,.62); padding: 8px 18px; font-size: 12px; font-weight: 700">日報</div>
    <div style="color: rgba(255,255,255,.62); padding: 8px 18px; font-size: 12px; font-weight: 700">予定</div>
    <div style="color: rgba(255,255,255,.62); padding: 8px 18px; font-size: 12px; font-weight: 700">名簿</div>
  </div>
</div>
</x-dc>
</body>
</html>
