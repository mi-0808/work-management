<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
    a { color: #1d4ed8; } a:hover { color: #0b2a6b; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #f4f7fc; color: #1e293b; display: flex; flex-direction: column; overflow: hidden">
  <div style="background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px">
    <div style="display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px">
      <div style="width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, #2563eb, #0b2a6b); display: grid; place-items: center; font-size: 15px">🌻</div>
      ひまわり事務機
    </div>
    <div style="width: 34px; height: 34px; border-radius: 50%; background: #facc15; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #0b2a6b">高</div>
  </div>
  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <div style="background: linear-gradient(135deg, #2563eb 0%, #0b2a6b 100%); border-radius: 20px; color: #fff; padding: 22px; position: relative; overflow: hidden; box-shadow: 0 12px 32px rgba(11,42,107,.25)">
      <div style="position: absolute; right: -40px; top: -40px; width: 150px; height: 150px; border-radius: 50%; background: rgba(250,204,21,.18)"></div>
      <div style="font-size: 13px; opacity: .85">2026年9月1日(火)</div>
      <div style="font-size: 42px; font-weight: 800; letter-spacing: 1px; margin: 4px 0 14px; font-variant-numeric: tabular-nums">14:07:26</div>
      <div style="display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.16); border-radius: 999px; padding: 4px 12px; font-size: 12px; margin-bottom: 14px">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #facc15"></span>勤務中
      </div>
      <div style="display: flex; gap: 10px; position: relative; z-index: 1">
        <div style="flex: 1; display: flex; gap: 1px">
          <div style="flex: 1; background: #facc15; color: #0b2a6b; border-radius: 12px 0 0 12px; padding: 14px 0; text-align: center; font-weight: 700; font-size: 15px; opacity: .55">出勤 09:00</div>
          <div style="min-width: 44px; background: #facc15; color: rgba(11,42,107,.7); border-radius: 0 12px 12px 0; display: grid; place-items: center">✎</div>
        </div>
        <div style="flex: 1; display: flex; gap: 1px">
          <div style="flex: 1; background: rgba(255,255,255,.94); color: #1d4ed8; border-radius: 12px 0 0 12px; padding: 14px 0; text-align: center; font-weight: 700; font-size: 15px">退勤する</div>
          <div style="min-width: 44px; background: rgba(255,255,255,.94); color: #64748b; border-radius: 0 12px 12px 0; display: grid; place-items: center; border-left: 1px solid #e2e8f0">✎</div>
        </div>
      </div>
      <div style="margin-top: 10px; background: rgba(255,255,255,.18); color: #fff; border: 1px solid rgba(255,255,255,.45); border-radius: 12px; padding: 13px 0; text-align: center; font-weight: 700; font-size: 14px; position: relative; z-index: 1">中抜け・休憩を開始</div>
    </div>
    <div style="background: #fff; border-radius: 16px; padding: 18px; box-shadow: 0 2px 8px rgba(30,41,59,.05)">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; margin-bottom: 10px">
        今日の予定 <span style="font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #eff6ff; color: #1d4ed8">出勤時に登録</span>
      </div>
      <div style="border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; font-size: 14px; background: #fbfcfe">見積書の作成、14時から取引先訪問</div>
      <div style="display: flex; gap: 10px; margin-top: 12px">
        <div style="background: #2563eb; color: #fff; border-radius: 10px; padding: 12px 18px; font-size: 14px; font-weight: 700">予定を保存</div>
        <div style="background: #fff; border: 1px solid #e2e8f0; color: #64748b; border-radius: 10px; padding: 12px 18px; font-size: 14px; font-weight: 700">🎥 MyHood</div>
      </div>
    </div>
    <div style="background: #fff; border-radius: 16px; padding: 18px; flex: 1; box-shadow: 0 2px 8px rgba(30,41,59,.05)">
      <div style="font-size: 16px; font-weight: 700; margin-bottom: 10px">最近の勤怠</div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #64748b; padding-bottom: 8px; border-bottom: 1px solid #e2e8f0">
        <span>日付</span><span>出勤</span><span>退勤</span><span>実働</span><span>状態</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 10px 0; border-bottom: 1px solid #f1f5f9">
        <span>09/01</span><span>09:00</span><span>—</span><span>5:07</span>
        <span style="font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #dbeafe; color: #1d4ed8">勤務中</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 10px 0">
        <span>08/31</span><span>09:00</span><span>18:00</span><span>9:00</span>
        <span style="font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #dbeafe; color: #1d4ed8">退勤済み</span>
      </div>
    </div>
  </div>
  <div style="background: rgba(255,255,255,.95); border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; padding: 10px 12px 22px">
    <div style="color: #1d4ed8; background: #eff6ff; border-radius: 12px; padding: 8px 18px; font-size: 12px; font-weight: 700">ホーム</div>
    <div style="color: #64748b; padding: 8px 18px; font-size: 12px; font-weight: 700">日報</div>
    <div style="color: #64748b; padding: 8px 18px; font-size: 12px; font-weight: 700">予定</div>
    <div style="color: #64748b; padding: 8px 18px; font-size: 12px; font-weight: 700">名簿</div>
  </div>
</div>
</x-dc>
</body>
</html>
